    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a" />
  
  <text x="40" y="70" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="bold" fill="#ff00ff" filter="url(#glow)">
